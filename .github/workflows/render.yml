name: Render video
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-crosextra-carlito
          pip install playwright numpy
          python -m playwright install --with-deps chromium
      - name: Render
        run: python build.py
      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output.mp4
          retention-days: 14
