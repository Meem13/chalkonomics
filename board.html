// ---------- helpers ----------
function text(s,txt,x,y,size,color,t0,t1,anchor="middle",weight=700,ls=2){
  const g=el("g",{},P(s));
  const te=el("text",{x,y,"font-size":size,fill:color,"text-anchor":anchor,"font-weight":weight,"letter-spacing":ls},g);

}
const kicker=(s,txt,t0,t1)=>text(s,txt,960,95,30,CYAN,t0,t1,"middle",700,8);
function path(s,d,color,w,t0,t1){

function ground(s,x0,x1,y,t0,t1,col){path(s,`M${x0} ${y} L${x1} ${y}`,col||LG,6,t0,t1)}
function arrowQ(s,x1,y1,qx,qy,x2,y2,col,t0,t1){
  const a=Math.atan2(y2-qy,x2-qx),h=30,sp=0.5;

}
const arrow=(s,x1,y1,x2,y2,col,t0,t1)=>arrowQ(s,x1,y1,(x1+x2)/2,(y1+y2)/2,x2,y2,col,t0,t1);

function countK(s,x,y,size,col,t0,t1,from,to){

function stickman(s,cx,gy,k,col,t0,fn,bow){

  ln(`M${cx-14*k} ${hy+11*k} Q ${cx} ${hy+28*k} ${cx+14*k} ${hy+11*k}`);
  el("circle",{cx:cx-24*k,cy:hy+10*k,r:6*k,fill:PINK},g); el("circle",{cx:cx+24*k,cy:hy+10*k,r:6*k,fill:PINK},g);

const idle=(ph)=>(t)=>[22+5*Math.sin(2*Math.PI*0.7*t+ph),-(22+5*Math.sin(2*Math.PI*0.7*t+ph+1))];

const SEG=[{"t0": 0.0, "t1": 0.73898, "text": "Two friends."}, {"t0": 1.26619, "t1": 4.67907, "text": "One invests twenty-four thousand dollars and then stops forever."}, {"t0": 5.23633, "t1": 7.78986, "text": "The other invests seventy-two thousand dollars,"}, {"t0": 8.10871, "t1": 9.14667, "text": "three times as much."}, {"t0": 9.6507, "t1": 11.519, "text": "Who ends up with more money at sixty-five?"}, {"t0": 12.2615, "t1": 14.3065, "text": "The answer surprises almost everyone,"}, {"t0": 14.6483, "t1": 16.2938, "text": "and it comes down to one idea:"}, {"t0": 16.8127, "t1": 17.8817, "text": "compound interest."}, {"t0": 18.717, "t1": 20.4599, "text": "Meet Early Ed and Late Lia."}, {"t0": 20.9928, "t1": 21.9705, "text": "Ed is twenty-five."}, {"t0": 22.5371, "t1": 26.5572, "text": "He puts two hundred dollars a month into an investment that earns seven percent a year."}, {"t0": 27.0615, "t1": 29.5057, "text": "He does this for ten years, until he's thirty-five."}, {"t0": 30.1098, "t1": 31.1195, "text": "Then he stops."}, {"t0": 31.5697, "t1": 33.1382, "text": "He never adds another dollar."}, {"t0": 33.8481, "t1": 35.2702, "text": "Lia is also twenty-five,"}, {"t0": 35.6502, "t1": 36.5908, "text": "but she waits."}, {"t0": 37.0387, "t1": 40.7028, "text": "She starts at thirty-five, and she invests the same two hundred dollars a month,"}, {"t0": 41.1402, "t1": 44.9637, "text": "but she keeps going for thirty years, all the way to sixty-five."}, {"t0": 45.6504, "t1": 48.6084, "text": "Seven percent a year is just an example to keep the math simple."}, {"t0": 49.0937, "t1": 52.1903, "text": "Real returns go up and down, and nobody can promise them."}, {"t0": 52.9451, "t1": 55.8243, "text": "Before we follow them, here's how compound interest works."}, {"t0": 56.3665, "t1": 58.2388, "text": "Imagine rolling a snowball down a hill."}, {"t0": 58.8245, "t1": 60.0088, "text": "At first it's tiny."}, {"t0": 60.5084, "t1": 62.2712, "text": "But as it rolls, it picks up snow,"}, {"t0": 62.6058, "t1": 65.7615, "text": "and the bigger it gets, the more snow it picks up with every turn."}, {"t0": 66.3572, "t1": 67.6533, "text": "Money does the same thing."}, {"t0": 68.1543, "t1": 69.4127, "text": "Your money earns interest."}, {"t0": 69.8831, "t1": 71.8512, "text": "Then that interest earns interest too."}, {"t0": 72.2894, "t1": 74.8618, "text": "And then the interest on the interest earns even more."}, {"t0": 75.3581, "t1": 77.9673, "text": "The longer it rolls, the faster it grows."}, {"t0": 78.654, "t1": 79.4482, "text": "Let's start with Ed."}, {"t0": 79.9499, "t1": 83.013, "text": "In his first ten years he puts in twenty-four thousand dollars."}, {"t0": 83.4897, "t1": 87.3482, "text": "By thirty-five, that has grown to about thirty-four thousand six hundred dollars."}, {"t0": 87.6767, "t1": 88.0974, "text": "Not bad."}, {"t0": 88.5841, "t1": 90.3712, "text": "And now Ed does nothing at all."}, {"t0": 90.837, "t1": 91.6601, "text": "He just lets it sit."}, {"t0": 92.2328, "t1": 96.173, "text": "At forty-five, it has grown to about sixty-nine thousand six hundred dollars."}, {"t0": 96.5698, "t1": 99.8451, "text": "At fifty-five, about one hundred thirty-nine thousand eight hundred."}, {"t0": 100.245, "t1": 103.858, "text": "And at sixty-five, about two hundred eighty-one thousand dollars."}, {"t0": 104.266, "t1": 106.874, "text": "From twenty-four thousand dollars of his own money."}, {"t0": 107.654, "t1": 108.198, "text": "Now Lia."}, {"t0": 108.654, "t1": 111.086, "text": "She starts at thirty-five, and she's disciplined."}, {"t0": 111.522, "t1": 112.38, "text": "Every single month,"}, {"t0": 112.713, "t1": 113.649, "text": "two hundred dollars,"}, {"t0": 113.966, "t1": 114.933, "text": "for thirty years."}, {"t0": 115.405, "t1": 118.689, "text": "At forty-five, she has about thirty-four thousand six hundred dollars."}, {"t0": 119.087, "t1": 120.846, "text": "That's what Ed had ten years earlier."}, {"t0": 121.306, "t1": 124.087, "text": "At fifty-five, about one hundred four thousand dollars."}, {"t0": 124.451, "t1": 128.167, "text": "And at sixty-five, about two hundred forty-four thousand dollars."}, {"t0": 128.569, "t1": 129.657, "text": "That's a great result."}, {"t0": 130.125, "t1": 133.205, "text": "But she put in seventy-two thousand dollars of her own money,"}, {"t0": 133.565, "t1": 135.291, "text": "and she still finished behind Ed."}, {"t0": 135.796, "t1": 136.117, "text": "Why?"}, {"t0": 136.769, "t1": 138.351, "text": "Look at Ed's last twenty years."}, {"t0": 138.814, "t1": 144.648, "text": "His balance climbed from thirty-four thousand to two hundred eighty-one thousand without him adding a single dollar."}, {"t0": 145.098, "t1": 147.437, "text": "Most of his final amount isn't money he saved."}, {"t0": 147.791, "t1": 149.444, "text": "It's growth on top of growth,"}, {"t0": 149.923, "t1": 151.106, "text": "and that needed time."}, {"t0": 151.421, "t1": 153.335, "text": "Lia put in three times as much,"}, {"t0": 153.725, "t1": 155.517, "text": "but her money had less time to roll."}, {"t0": 156.146, "t1": 157.635, "text": "So what does this mean for you?"}, {"t0": 158.302, "t1": 159.74, "text": "First, start early,"}, {"t0": 160.048, "t1": 160.933, "text": "even if it's small."}, {"t0": 161.527, "t1": 165.093, "text": "A small amount started early can beat a bigger amount started late."}, {"t0": 165.602, "t1": 168.162, "text": "Second, don't wait until you feel ready."}, {"t0": 168.724, "t1": 170.197, "text": "Ed didn't have a perfect plan."}, {"t0": 170.658, "t1": 171.365, "text": "He just started."}, {"t0": 171.894, "t1": 172.166, "text": "Third,"}, {"t0": 172.574, "t1": 173.594, "text": "if you're already late,"}, {"t0": 173.929, "t1": 174.445, "text": "don't give up."}, {"t0": 175.066, "t1": 179.4, "text": "Lia still ended up with a lot, and she's far better off than someone who never started."}, {"t0": 179.95, "t1": 182.035, "text": "The best time to begin was years ago."}, {"t0": 182.488, "t1": 184.194, "text": "The second best time is today."}, {"t0": 184.687, "t1": 185.15, "text": "And fourth,"}, {"t0": 185.662, "t1": 186.253, "text": "automate it."}, {"t0": 186.712, "t1": 189.51, "text": "Set up a monthly transfer so you never have to remember."}, {"t0": 190.067, "t1": 190.682, "text": "One last thing."}, {"t0": 191.179, "t1": 193.739, "text": "These numbers are an example, not a promise."}, {"t0": 194.17, "t1": 196.018, "text": "Real investments go up and down,"}, {"t0": 196.442, "t1": 197.749, "text": "fees and inflation matter,"}, {"t0": 198.139, "t1": 199.739, "text": "and this isn't financial advice."}, {"t0": 200.109, "t1": 202.606, "text": "It's a way to see why time matters so much."}, {"t0": 203.092, "t1": 205.315, "text": "If this helped, subscribe to Chalkonomics."}, {"t0": 205.784, "t1": 207.577, "text": "Next time, we'll talk about inflation,"}, {"t0": 207.932, "t1": 210.632, "text": "the quiet reason your money buys less every year."}, {"t0": 211.147, "t1": 211.879, "text": "See you then."}];
const capWords=[];

let lastSeed=-1;
const cubicPos=bez;
function render(t){
  const seed=Math.floor(t*8)%40+1;
  if(seed!==lastSeed){lastSeed=seed;document.getElementById("t1").setAttribute("seed",seed);document.getElementById("t2").setAttribute("seed",seed)}
  scenes.forEach((s,i)=>{
    const a=Math.min(prog(t,s.a,s.a+0.25),1-prog(t,s.o,s.e));
    sg[i].setAttribute("opacity",(t>=s.a&&t<=s.e)?(i==0?1-prog(t,s.o,s.e):a):0);
    sg[i].style.display=(t>=s.a-0.01&&t<=s.e)?"":"none";
  });
  items.forEach(it=>{
    switch(it.k){
    case "text": it.r.setAttribute("width",Math.max(0,(it.bb.width+20)*ease(prog(t,it.t0,it.t1)))); break;
    case "path":{const p=ease(prog(t,it.t0,it.t1));it.p.setAttribute("stroke-dashoffset",1-p);it.p.setAttribute("opacity",p>0?1:0);break}
    case "fadeIn": it.node.setAttribute("opacity",prog(t,it.t0,it.t1)); break;
    case "fadeOut": it.node.setAttribute("opacity",1-prog(t,it.t0,it.t1)); break;
    case "pop":{
      const p=(t-it.t0)/0.45; const sc=p<=0?0:p>=1?1:1+2.70158*Math.pow(p-1,3)+1.70158*Math.pow(p-1,2);
      it.g.setAttribute("opacity",sc>0?1:0);
      if(!it.g.getAttribute("data-fixed")) it.g.setAttribute("transform",`translate(${it.cx} ${it.cy}) scale(${Math.max(sc,0.001)}) translate(${-it.cx} ${-it.cy})`);
      break}
    case "count":{const v=it.from+(it.to-it.from)*ease(prog(t,it.t0,it.t1));it.node.textContent=fmtK(v);break}
    case "stick":{
      const [r,l]=it.fn(t), ex=a=>[it.cx+it.L*Math.sin(rad(a)), it.sy+it.L*Math.cos(rad(a))];
      const [rx,ry]=ex(r),[lx,ly]=ex(l);
      it.ra.setAttribute("d",`M${it.cx} ${it.sy} L${rx} ${ry}`); it.la.setAttribute("d",`M${it.cx} ${it.sy} L${lx} ${ly}`); break}
    case "hbar": it.r.setAttribute("width",Math.max(0,(it.x1-it.x0)*ease(prog(t,it.t0,it.t1)))); it.r.setAttribute("opacity",t>=it.t0?1:0); break;
    case "sbar":{
      const py=ease(prog(t,it.ty0,it.ty1)), pg=ease(prog(t,it.tg0,it.tg1));
      const hy=it.hy*py, hg=it.hg*pg;
      it.ry.setAttribute("y",it.base-hy); it.ry.setAttribute("height",Math.max(0,hy)); it.ry.setAttribute("opacity",hy>1?1:0);
      it.rg.setAttribute("y",it.base-it.hy*py-hg); it.rg.setAttribute("height",Math.max(0,hg)); it.rg.setAttribute("opacity",hg>1?1:0); break}
    case "ball":{
      const p=(t-it.t0)/0.45; const sc=p<=0?0:p>=1?1:1+2.70158*Math.pow(p-1,3)+1.70158*Math.pow(p-1,2);
      const u=ease(prog(t,it.t0+0.3,it.t1)), r=(24+130*Math.pow(u,1.7))*Math.max(sc,0.001);
      const [px,py]=cubicPos(u), [tx,ty]=bezT(u); let nx=-ty, ny=tx; const nl=Math.hypot(nx,ny); nx/=nl; ny/=nl; if(ny>0){nx=-nx;ny=-ny}
      const cx=px+nx*(r-2), cy=py+ny*(r-2);
      it.c.setAttribute("cx",cx); it.c.setAttribute("cy",cy); it.c.setAttribute("r",r);
      const phi=u*1700/Math.max(r,1)*1.0; it.m.setAttribute("cx",cx+r*0.6*Math.cos(phi)); it.m.setAttribute("cy",cy+r*0.6*Math.sin(phi)); it.m.setAttribute("r",Math.max(3,r*0.1));
      it.g.setAttribute("opacity",sc>0?1:0); break}
    }
  });
  capWords.forEach(c=>{
    const on=t>=c.t0&&t<=c.end;
    c.e.setAttribute("opacity",on?1:0);
    c.e.setAttribute("fill",(t>=c.t0&&t<c.t1+0.05)?YEL:W);
  });
}
